<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buuro - Platforma de Jogos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0f1a;
            color: #fff;
            overflow: hidden;
        }

        .wrap {
            display: flex;
            flex-direction: row;
            gap: 12px;
            padding: 12px;
            height: 100%;
            box-sizing: border-box;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.1);
            backdrop-filter: blur(10px);
        }

        .panel h2 {
            margin: 12px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        .frame {
            flex: 1;
            border: 0;
            width: 100%;
            background: transparent;
        }

        #landing-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 15, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 9999;
        }

        .overlay-content {
            text-align: center;
            color: #fff;
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .overlay-content h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay-content p {
            opacity: 0.8;
            margin-bottom: 28px;
            font-size: 1rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-family: 'Poppins', sans-serif;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #start-all {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #000;
            font-weight: 700;
            grid-column: 1 / -1;
        }

        #start-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
        }

        #start-forca {
            background: rgba(239, 68, 68, 0.8);
            color: #fff;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        #start-forca:hover {
            background: rgba(239, 68, 68, 1);
            box-shadow: 0 8px 16px rgba(239, 68, 68, 0.2);
        }

        #start-bilhao {
            background: rgba(34, 197, 94, 0.8);
            color: #fff;
            border: 1px solid rgba(34, 197, 94, 0.5);
        }

        #start-bilhao:hover {
            background: rgba(34, 197, 94, 1);
            box-shadow: 0 8px 16px rgba(34, 197, 94, 0.2);
        }

        #start-solitaire {
            background: rgba(147, 51, 234, 0.8);
            color: #fff;
            border: 1px solid rgba(147, 51, 234, 0.5);
        }

        #start-solitaire:hover {
            background: rgba(147, 51, 234, 1);
            box-shadow: 0 8px 16px rgba(147, 51, 234, 0.2);
        }

        #start-charadas {
            background: rgba(234, 88, 12, 0.8);
            color: #fff;
            border: 1px solid rgba(234, 88, 12, 0.5);
        }

        #start-charadas:hover {
            background: rgba(234, 88, 12, 1);
            box-shadow: 0 8px 16px rgba(234, 88, 12, 0.2);
        }

        #start-minimal {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.4);
            grid-column: 1 / -1;
        }

        #start-minimal:hover {
            background: rgba(148, 163, 184, 0.1);
            border-color: rgba(148, 163, 184, 0.8);
        }

        @media (max-width: 1600px) {
            .wrap {
                flex-direction: column;
                height: auto;
            }
            
            .panel {
                height: 50vh;
            }
        }

        @media (max-width: 980px) {
            .panel {
                height: 45vh;
            }

            .panel h2 {
                font-size: 0.85rem;
                margin: 10px 14px;
            }
        }

        @media (max-width: 640px) {
            .overlay-content {
                padding: 30px;
            }

            .overlay-content h1 {
                font-size: 1.8rem;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="landing-overlay" role="dialog" aria-modal="true">
        <div class="overlay-content">
            <h1>🎮 Buuro</h1>
            <p>Escolha seus jogos ou inicie todos de uma vez</p>
            <div class="button-grid">
                <button id="start-all">Iniciar Todos</button>
                <div class="button-group">
                    <button id="start-forca">Forca</button>
                    <button id="start-bilhao">Bilhão</button>
                    <button id="start-solitaire">Solitário</button>
                    <button id="start-charadas">Charadas</button>
                </div>
                <button id="start-minimal">Apenas Ver</button>
            </div>
        </div>
    </div>

    <div class="wrap">
        <div class="panel">
            <h2>🔤 Forca</h2>
            <iframe class="frame" src="jogo-forca-completo.html" title="Jogo da Forca"></iframe>
        </div>
        <div class="panel">
            <h2>💰 Bilhão</h2>
            <iframe class="frame" src="jogo-do-bilhao.html" title="Jogo do Bilhão"></iframe>
        </div>
        <div class="panel">
            <h2>🃏 Solitário</h2>
            <iframe class="frame" src="solitaire.html" title="Solitário Klondike"></iframe>
        </div>
        <div class="panel">
            <h2>🤔 Charadas</h2>
            <iframe class="frame" src="charadas do socrates/index.html" title="Charadas do Sócrates"></iframe>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('landing-overlay');
        const iframeForca = document.querySelector('iframe[title="Jogo da Forca"]');
        const iframeBilhao = document.querySelector('iframe[title="Jogo do Bilhão"]');
        const iframeSolitaire = document.querySelector('iframe[title="Solitário Klondike"]');
        const iframeCharadas = document.querySelector('iframe[title="Charadas do Sócrates"]');

        document.getElementById('start-all').addEventListener('click', () => {
            try { iframeForca.contentWindow.postMessage({type:'start'}, '*'); } catch(e){}
            try { iframeBilhao.contentWindow.postMessage({type:'start'}, '*'); } catch(e){}
            try { iframeSolitaire.contentWindow.postMessage({type:'start'}, '*'); } catch(e){}
            try { iframeCharadas.contentWindow.postMessage({type:'start'}, '*'); } catch(e){}
            overlay.style.display = 'none';
        });

        document.getElementById('start-forca').addEventListener('click', () => {
            try { iframeForca.contentWindow.postMessage({type:'start'}, '*'); } catch(e){}
            overlay.style.display = 'none';
        });

        document.getElementById('start-bilhao').addEventListener('click', () => {
            try { iframeBilhao.contentWindow.postMessage({type:'start'}, '*'); } catch(e){}
            overlay.style.display = 'none';
        });

        document.getElementById('start-solitaire').addEventListener('click', () => {
            try { iframeSolitaire.contentWindow.postMessage({type:'start'}, '*'); } catch(e){}
            overlay.style.display = 'none';
        });

        document.getElementById('start-charadas').addEventListener('click', () => {
            try { iframeCharadas.contentWindow.postMessage({type:'start'}, '*'); } catch(e){}
            overlay.style.display = 'none';
        });

        document.getElementById('start-minimal').addEventListener('click', () => {
            overlay.style.display = 'none';
        });
    </script>
</body>
</html>
