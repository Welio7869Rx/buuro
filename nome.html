<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificação | Buuro</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #212121, #0b1220 60%, #04070e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        main {
            width: min(100%, 460px);
            padding: 36px 28px;
            text-align: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 10px;
            color: #f5c542;
            font-size: 2rem;
        }

        p {
            margin: 0 0 24px;
            color: #c4c4d2;
        }

        form {
            display: grid;
            gap: 14px;
        }

        input,
        button {
            min-height: 48px;
            padding: 12px 16px;
            border-radius: 8px;
            font: inherit;
        }

        input {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        input::placeholder {
            color: #c4c4d2;
        }

        input:focus-visible,
        button:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        button {
            border: 0;
            background: #f5c542;
            color: #171717;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #ffd95e;
        }
    </style>
</head>
<body>
    <main>
        <h1>Seu nome</h1>
        <p>Digite seu nome para continuar aos jogos.</p>
        <form id="name-form">
            <input id="player-name" name="player-name" type="text" placeholder="Digite seu nome" autocomplete="given-name" maxlength="40" required>
            <button type="submit">Continuar</button>
        </form>
    </main>

    <script>
        const playerNameKey = 'buuro-player-name';
        const nameForm = document.getElementById('name-form');
        const nameInput = document.getElementById('player-name');

        try {
            nameInput.value = localStorage.getItem(playerNameKey) || '';
        } catch (error) {
            nameInput.value = '';
        }

        nameForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const playerName = nameInput.value.trim();
            if (!playerName) return;

            let destination = 'index.html#menu-container';
            try {
                localStorage.setItem(playerNameKey, playerName);
            } catch (error) {
                destination = `index.html?nome=${encodeURIComponent(playerName)}#menu-container`;
            }
            window.location.href = destination;
        });
    </script>
</body>
</html>
